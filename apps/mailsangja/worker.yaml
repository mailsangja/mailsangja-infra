apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: mailsangja
  labels:
    app.kubernetes.io/name: mailsangja
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8081
      targetPort: http
  selector:
    app.kubernetes.io/name: mailsangja
    app.kubernetes.io/component: worker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: mailsangja
  labels:
    app.kubernetes.io/name: mailsangja
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailsangja
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailsangja
        app.kubernetes.io/component: worker
    spec:
      initContainers:
        - name: wait-for-infra
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until nc -z postgres 5432; do sleep 2; done
              until nc -z redis 6379; do sleep 2; done
              until nc -z rabbitmq 5672; do sleep 2; done
      containers:
        - name: worker
          image: ghcr.io/mailsangja/mailsangja-worker:sha-c5aedfd5739e6aea9a39e8fef1bcbd29ca9e3fc5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: mailsangja-infra-config
            - secretRef:
                name: mailsangja-infra-secret
            - secretRef:
                name: mailsangja-app-secret
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
