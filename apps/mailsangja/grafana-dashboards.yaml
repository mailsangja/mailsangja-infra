  gmail-sync-debug.json: |
    {
      "uid": "mailsangja-gmail-sync-debug",
      "title": "Mailsangja Gmail Sync Debug",
      "tags": ["mailsangja", "gmail", "debug"],
      "timezone": "browser",
      "schemaVersion": 41,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "workId",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            }
          },
          {
            "name": "mailAccountId",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            }
          },
          {
            "name": "gmailThreadId",
            "type": "textbox",
