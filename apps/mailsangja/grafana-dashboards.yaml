            "showCommonLabels": false,
            "showLabels": false,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{service=~\"mailsangja-core|mailsangja-worker\"} | json | workId=\"$workId\"",
              "queryType": "range"
            }
          ]
        },
        {
