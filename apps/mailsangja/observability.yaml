apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: mailsangja
  labels:
    app.kubernetes.io/name: mailsangja
    app.kubernetes.io/component: alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy-pod-logs
  namespace: mailsangja
  labels:
    app.kubernetes.io/name: mailsangja
    app.kubernetes.io/component: alloy
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy-pod-logs
  namespace: mailsangja
  labels:
    app.kubernetes.io/name: mailsangja
    app.kubernetes.io/component: alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alloy-pod-logs
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: mailsangja
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: mailsangja
  labels:
    app.kubernetes.io/name: mailsangja
    app.kubernetes.io/component: loki
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage_config:
      filesystem:
        directory: /loki/chunks

    limits_config:
      allow_structured_metadata: true
      retention_period: 336h
      max_query_lookback: 336h

    compactor:
      working_directory: /loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 50
      delete_request_store: filesystem

    analytics:
      reporting_enabled: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: mailsangja
  labels:
    app.kubernetes.io/name: mailsangja
    app.kubernetes.io/component: tempo
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/traces

    compactor:
      compaction:
        block_retention: 24h
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: mailsangja
  labels:
    app.kubernetes.io/name: mailsangja
    app.kubernetes.io/component: alloy
data:
  config.alloy: |
    logging {
      level = "info"
    }

    discovery.kubernetes "mailsangja_pods" {
      role = "pod"

      namespaces {
        names = ["mailsangja"]
      }
    }

    discovery.relabel "mailsangja_app_pods" {
      targets = discovery.kubernetes.mailsangja_pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        regex         = "mailsangja"
        action        = "keep"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
        regex         = "(core|worker)"
        action        = "keep"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
        target_label  = "app"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
        regex         = "(.+)"
        replacement   = "mailsangja-$1"
        target_label  = "service"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
    }

    loki.source.kubernetes "mailsangja_app_pods" {
      targets    = discovery.relabel.mailsangja_app_pods.output
      forward_to = [loki.process.mailsangja_logs.receiver]
    }

    loki.process "mailsangja_logs" {
      stage.json {
        expressions = {
          level          = "level",
          logger_name    = "logger_name",
          thread_name    = "thread_name",
          workId         = "workId",
          userId         = "userId",
          mailAccountId  = "mailAccountId",
          jobId          = "jobId",
          gmailThreadId  = "gmailThreadId",
          gmailMessageId = "gmailMessageId",
          historyId      = "historyId",
          eventType      = "eventType",
          routingKey     = "routingKey",
          queue          = "queue",
          traceId        = "traceId",
          spanId         = "spanId",
        }
      }

      stage.labels {
        values = {
          level      = "",
          queue      = "",
          routingKey = "",
          eventType  = "",
        }
      }

      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"
      }
    }

    otelcol.receiver.otlp "default" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }

      http {
        endpoint = "0.0.0.0:4318"
      }

      output {
        traces = [otelcol.exporter.otlp.tempo.input]
      }
    }

    otelcol.exporter.otlp "tempo" {
      client {
        endpoint = "tempo:4317"

        tls {
          insecure = true
        }
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: mailsangja
  labels:
    app.kubernetes.io/name: mailsangja
    app.kubernetes.io/component: grafana
data:
  datasources.yaml: |
    apiVersion: 1

    datasources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki:3100
        isDefault: true
        jsonData:
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: '"traceId":"([a-fA-F0-9]+)"'
              name: TraceID
              url: '$${__value.raw}'

      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            tags:
              - key: service.name
                value: service
              - key: app
                value: app
            filterByTraceID: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  namespace: mailsangja
  labels:
    app.kubernetes.io/name: mailsangja
    app.kubernetes.io/component: grafana
data:
  dashboards.yaml: |
    apiVersion: 1

    providers:
      - name: mailsangja-observability
        orgId: 1
        folder: Mailsangja
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/provisioning/dashboards/mailsangja
