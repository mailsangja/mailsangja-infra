apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mailsangja
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  project: default

  source:
    repoURL: https://github.com/mailsangja/mailsangja-infra.git
    targetRevision: main
    path: apps/mailsangja

  destination:
    server: https://kubernetes.default.svc
    namespace: mailsangja

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
